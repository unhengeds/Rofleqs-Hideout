<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rofleq's Hideout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050505;
            --sidebar: #080808;
            --panel: #0d0d0d;
            --panel2: #121212;

            --text: #ffffff;
            --muted: #8d8d8d;

            --green: #20d65a;
            --green2: #39ff78;

            --red: #e3262e;
            --red2: #ff4048;

            --border: rgba(227, 38, 46, 0.25);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* MOVING CHECKERBOARD BACKGROUND */
        body::before {
            content: "";
            position: fixed;
            inset: -100px;
            z-index: -2;
            pointer-events: none;

            background:
                linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.018) 25%,
                    transparent 25%,
                    transparent 75%,
                    rgba(255, 255, 255, 0.018) 75%
                ),
                linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.018) 25%,
                    transparent 25%,
                    transparent 75%,
                    rgba(255, 255, 255, 0.018) 75%
                );

            background-size: 80px 80px;
            background-position:
                0 0,
                40px 40px;

            animation: checkerMove 6s linear infinite;
        }

        /* DARK OVERLAY TO KEEP IT SUBTLE */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(227, 38, 46, 0.025),
                    transparent 45%
                ),
                rgba(5, 5, 5, 0.72);
        }

        @keyframes checkerMove {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(80px, 80px);
            }
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: rgba(8, 8, 8, 0.94);
            border-right: 1px solid var(--red);
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px;
            margin-bottom: 45px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #ff4048,
                #a50008
            );
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(227, 38, 46, 0.35);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--red2);
        }

        .logo-text span {
            color: var(--green2);
        }

        .version-text {
            font-size: 9px;
            color: #666;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        .nav-title {
            color: #6d3033;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 12px;
            margin-bottom: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 9px;
            color: var(--muted);
            text-decoration: none;
            margin-bottom: 5px;
            transition: 0.2s;
            font-size: 14px;
        }

        .nav-item:hover {
            color: white;
            background: rgba(227, 38, 46, 0.10);
        }

        .nav-item.active {
            color: white;
            background: rgba(227, 38, 46, 0.14);
            border-left: 3px solid var(--red);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 17px;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 15px 10px 5px;
            color: #555;
            font-size: 11px;
            line-height: 1.5;
        }

        /* MAIN */
        .main {
            margin-left: 240px;
            min-height: 100vh;
        }

        /* TOPBAR */
        .topbar {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid var(--red);
            background: rgba(5, 5, 5, 0.92);
        }

        .topbar-title {
            font-size: 14px;
            color: var(--muted);
        }

        .topbar-title strong {
            color: var(--red2);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7d7d7d;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
        }

        /* CONTENT */
        .content {
            padding: 45px;
            max-width: 1400px;
            margin: auto;
        }

        .welcome {
            margin-bottom: 35px;
        }

        .welcome h1 {
            font-size: 38px;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .welcome h1 span {
            color: var(--red2);
        }

        .welcome p {
            color: var(--muted);
            font-size: 15px;
        }

        /* SECTION */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
        }

        .section-line {
            height: 1px;
            flex: 1;
            background: var(--red);
            margin-left: 20px;
            box-shadow: 0 0 8px rgba(227, 38, 46, 0.25);
        }

        /* GAME GRID */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        /* GAME CARD */
        .game-card {
            position: relative;
            background: rgba(13, 13, 13, 0.94);
            border: 1px solid rgba(227, 38, 46, 0.35);
            border-radius: 13px;
            overflow: hidden;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--red2);
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(227, 38, 46, 0.12);
        }

        /* GAME IMAGE */
        .game-image {
            height: 145px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    rgba(255, 64, 72, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 70% 70%,
                    rgba(180, 0, 10, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #180608,
                    #0a0a0a
                );

            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .game-image::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent 49%,
                    rgba(227, 38, 46, 0.08) 50%,
                    transparent 51%
                ),
                linear-gradient(
                    0deg,
                    transparent 49%,
                    rgba(227, 38, 46, 0.08) 50%,
                    transparent 51%
                );

            background-size: 32px 32px;
        }

        .minecraft-logo {
            position: relative;
            z-index: 1;
            font-size: 30px;
            font-weight: 900;
            color: white;

            text-shadow:
                3px 3px 0 #111,
                0 0 18px rgba(255, 64, 72, 0.25);

            letter-spacing: -1px;
        }

        .minecraft-logo span {
            color: var(--red2);
        }

        /* CARD INFO */
        .game-info {
            padding: 17px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .game-meta {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* GREEN PLAY BUTTON */
        .play-small {
            width: 100%;
            border: none;
            border-radius: 7px;
            padding: 10px;
            background: var(--green);
            color: #031007;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-small:hover {
            background: var(--green2);
            box-shadow: 0 0 18px rgba(57, 255, 120, 0.35);
        }

        /* RED ACCENT */
        .red-accent {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 7px;
            height: 7px;
            background: var(--red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--red);
        }

        /* FOOTER */
        footer {
            margin-top: 55px;
            padding: 25px 0;
            color: #555;
            border-top: 1px solid var(--red);
            font-size: 12px;
        }

        footer span {
            color: var(--red2);
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--red);
                padding: 18px;
            }

            .logo {
                margin-bottom: 18px;
            }

            .nav-title {
                display: none;
            }

            .nav-item {
                display: none;
            }

            .sidebar-bottom {
                display: none;
            }

            .main {
                margin-left: 0;
            }

            .topbar {
                padding: 0 20px;
            }

            .content {
                padding: 28px 20px;
            }

            .welcome h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                R
            </div>

            <div>
                <div class="logo-text">
                    <span style="color: #e3262e;">Rofleq's</span>
                    <span style="color: #39ff78;">Hideout</span>
                </div>

                <div class="version-text">
                    Github Version
                </div>
            </div>

        </div>

        <div class="nav-title">
            Menu
        </div>

        <a href="#" class="nav-item active">

            <div class="nav-icon">
                ⌂
            </div>

            Home

        </a>

        <div class="sidebar-bottom">

            Rofleq's Hideout<br>

            <span style="color:#e3262e;">
                Game Hub
            </span>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="topbar-title">

                Welcome to
                <strong>Rofleq's Hideout</strong>

            </div>

            <div class="status">

                <div class="status-dot"></div>

                Online

            </div>

        </header>


        <!-- CONTENT -->
        <div class="content">

            <section class="welcome">

                <h1>
                    Welcome to
                    <span>Rofleq's Hideout</span>
                </h1>

                <p>
                    Presented to you by Rofleq
                </p>

            </section>


            <!-- GAMES -->
            <section>

                <div class="section-header">

                    <div class="section-title">
                        Games
                    </div>

                    <div class="section-line"></div>

                </div>


                <div class="game-grid">

                    <!-- MINECRAFT -->
                    <article
                        class="game-card"
                        onclick="launchGame('games/eaglercraft-1.9.4/index.html')"
                    >

                        <div class="game-image">

                            <div class="red-accent"></div>

                            <div class="minecraft-logo">
                                MINE<span>CRAFT</span>
                            </div>

                        </div>


                        <div class="game-info">

                            <div class="game-title">
                                Minecraft
                            </div>

                            <div class="game-meta">
                                1.9.4
                            </div>


                            <button
                                class="play-small"
                                onclick="event.stopPropagation(); launchGame('games/eaglercraft-1.9.4/index.html')"
                            >
                                ▶ PLAY
                            </button>

                        </div>

                    </article>

                </div>

            </section>


            <footer>

                Rofleq's Hideout
                <span>•</span>
                More games coming soon.

            </footer>

        </div>

    </main>


    <script>

        function launchGame(path) {
            window.location.href = path;
        }

    </script>

</body>
</html>
