<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base target="_top"
        href="https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/retrobowl/">

  <title>Retro Bowl</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/x-icon" href="retrobowl.ico">

  <!-- FIXED: absolute CDN paths -->
  <script src="js/all.js"></script>

  <style>
    body {
      background: #000;
      color: #ccc;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    canvas {
      image-rendering: optimizeSpeed;
      -webkit-interpolation-mode: nearest-neighbor;
      -ms-touch-action: none;
      margin: 0;
      padding: 0;
      border: 0;
    }

    div.gm4html5_div_class {
      margin: 0;
      padding: 0;
      border: 0;
    }

    :-webkit-full-screen {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <img
      src="html5game/splash.png"
      id="GM4HTML5_loadingscreen"
      alt="Loading"
      style="display:none"
    >

    <canvas id="canvas" width="960" height="540">
      <p>Your browser doesn't support HTML5 canvas.</p>
    </canvas>
  </div>

  <!-- Game code -->
  <script src="html5game/RetroBowl.js"></script>
  <script>
    window.onload = function () {
      if (typeof GameMaker_Init === "function") {
        GameMaker_Init();
      }
    };
  </script>

  <!-- FIXED: remove leading slash -->
  <script src="html/settings/js/index.js"></script>
</body>
</html>
